# Curated sources of the pipeline. Verified on 2026-10-25 (robots.txt, TDM reservation, bot protection, feed content).
# The monthly source review (src/source_review.py, workflow source_review.yml) proposes changes as a pull request.
# The comment line above each entry records the result of the check: the time span of the items of each feed and
# news sitemap in hours, and the reasons for fetch_pages.
# Lifecycle keys of every source:
#   added = YYYY-MM-DD           day on which the source was added to the list
#   removed = YYYY-MM-DD         day on which the source was removed; the entry stays, so that its coverage period is known
#   removed_reason = "..."       why the source was removed
#   keep = true                  the review does not propose a removal for low yield
# Outlets have an outlet_type, the publisher group (owner_group), the paywall model, the state of a regional outlet
# (home_state) and the sector of a trade publication (sector). Press sources have an actor_type, a jurisdiction (DE, a
# state code, EU or INT) and, for companies, the company_id of config/companies.toml.
# [[excluded]] entries at the end are candidates that were checked and not admitted. The search does not propose
# them again. Status blocked, tdm_reserved, duplicate and not_relevant are permanent; entries with no_feed, inactive
# or robots and a kind are checked again by every review and added when they pass.


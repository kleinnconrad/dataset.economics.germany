# Catalog of the statistical series collected by the economics dataset.
#
# Every [[series]] entry describes one concept at one provider:
#   concept         what the series measures, independent of the country (lower-case snake_case)
#   name            name of the series
#   topic           topic group (SeriesTopic in src/schema.py)
#   frequency       D daily, W weekly, M monthly, Q quarterly, S half-yearly, A annual
#   unit            unit of the values
#   provider        eurostat, ecb, bundesbank (SDMX 2.1 REST), worldbank_cmo (Pink Sheet), smard
#   flow            dataset or dataflow; for worldbank_cmo the sheet, for smard "chart_data"
#   key             series key; {geo} is replaced by every code in geos; for worldbank_cmo the column
#                   header, for smard "<filter>/<region>"
#   geo / geos      country or area: Eurostat country codes, EA (euro area, changing composition),
#                   EU27_2020, WLD (world prices); in ECB keys EA is written as U2
#   geo_codes       optional codes of the provider for single geos, e.g. { EA = "EA21" } for Eurostat datasets
#                   that publish the euro area only in fixed compositions (EA21: the 21 members since 2026,
#                   computed back for the whole series)
#   added           day on which the entry was added; start of collection
#   notes           optional remarks
# Each geo of an entry is a series with the id <concept>.<geo>, the join key series_id of the datasets
# economic_series and series_catalog.
#
# Rules (CLAUDE.md, section 9): series ids are never changed or reused for another meaning; a series that is
# no longer collected keeps its entry with removed = <date> and removed_reason = "..."; every new or changed
# key is verified against the live provider before it is committed; every change of a key, unit or provider
# is recorded in the measurement log of project_architecture.md.
#
# All keys of the initial entries were verified on 2026-10-25.


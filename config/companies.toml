# Registry of the companies tracked by the economics dataset.
#
# Every [[company]] entry has a stable id (the join key company_id of the datasets companies,
# wikipedia_pageviews, press_releases and text_annotations), a name, the main sector (Sector in
# src/schema.py), the country of the headquarters, whether the shares are listed, and the date on
# which it was added. Optional keys:
#   aliases    further names under which the annotation resolves the company (brands, former names,
#              short forms); every name belongs to one entry only
#   isin       ISIN of the main share line of a listed company
#   wikidata   Wikidata id; the German Wikipedia article is resolved at run time for the pageviews
# Index memberships are not stored, because they change. The comment line above each entry holds
# the title of the German Wikipedia article at the time of the verification.
#
# Rules (CLAUDE.md, section 9): ids are never changed or reused; a company that is no longer tracked
# keeps its entry with removed = <date> and removed_reason = "..."; every new or changed identifier is
# verified against the live source (Wikidata, German Wikipedia) before it is committed. The monthly
# source review lists frequent company names of the annotations that are not in the registry.
#
# The initial entries were verified on 2026-10-25: the Wikidata ids of listed companies by their ISIN
# (Wikidata property P946), the ISINs of the DAX members against the index composition, and the ISINs of
# Qiagen, Schaeffler, Renk and Shell against the German Wikipedia, where Wikidata listed only former ISINs.

